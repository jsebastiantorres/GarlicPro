<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saidas</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <!-- <link rel="stylesheet" href="src/input.css"> -->
    <link href="./src/output.css" rel="stylesheet">
    <link rel="stylesheet" href="src/custom.css">
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
</head>

<body class="bg-all-pages">

    <div class="flex flex-col p-2 h-screen">

        <!-- Barra de navegación -->
        <div class="max-w-screen">
            <section class="barra_navegacion ">
                <nav class="max-w-screen bg-emerald-700 p-2 rounded-xl shadow-md shadow-gray-400">
                    <ul class="flex justify-between">
                        <li class="p-2 text-white">
                            <div class="w-8">
                                <a href="index.html" class="flex justify-between">
                                    <img src="./img/logo1.png" alt="">
                                    <h1 class="font-bold">GarlicPro</h1>
                                </a>
                                <!-- <a class="font-bold text-xl" href="#">LOGO</a> -->
                            </div>
                        </li>
                        <div class="flex justify-between ">
                            <li class="p-2">
                                <!-- Trae el nombre del usuario del login correspondiente script:iu/navbar.js -->
                                <div id="nav_nombre_usuario"></div>
                                <!-- <h4 class="text-white font-bold">Nombre Completo</h4> -->
                            </li>
                            <li class="p-2 content-center">
                                <i id="menuToggle"
                                    class="fa-solid fa-circle-user text-white text-xl hover:text-green-500 text-bold"></i>
                                <div x-show="open" id="menu"
                                    class="absolute right-2 mt-2 w-48 bg-white rounded shadow-lg hidden">
                                    <!-- <button class="block px-4 py-2 text-left w-full hover:bg-gray-200 hover:rounded">Perfil</button> -->
                                    <button
                                        class="flex items-center space-x-2 px-4 py-2 text-left w-full hover:bg-red-500 hover:text-white hover:rounded hover:font-semibold"
                                        id="logoutButton">
                                        <i class="fa-solid fa-power-off "></i>
                                        <p>Cerrar sesión</p>
                                    </button>
                                </div>
                            </li>
                        </div>
                    </ul>
                </nav>
            </section>
        </div>

        <!-- main -->
        <div class="flex flex-1 py-2 ">

            <!-- Sidebar -->
            <section class="sidebar flex">
                <aside
                    class="flex flex-col w-16 md:w-32 lg:w-64 md:p-2 lg:p-4 rounded-xl shadow-md bg-gray-800 text-white shadow-gray-400">
                    <!--<h2 class="text-xl font-bold mb-4">Menú</h2>-->
                    <ul class="space-y-3 pb-4 grid justify-items-stretch">
                        <li class="justify-between hover:bg-gray-700 px-4 py-2 rounded-lg">
                            <a href="index.html"
                                class="flex flex-col items-start justify-center sm:items-center sm:justify-center lg:flex-row lg:items-center lg:justify-start">
                                <i class="fa-solid fa-boxes-stacked px-4 py-2"></i>
                                <p>Inventario</p>
                            </a>
                        </li>
                        <li class="justify-between hover:bg-gray-700 px-4 py-2 rounded-lg">
                            <a href="ingresos.html"
                                class="flex flex-col items-start justify-center sm:items-center sm:justify-center lg:flex-row lg:items-center lg:justify-start">
                                <i class="fa-solid fa-right-to-bracket px-4 py-2"></i>
                                <p class="">Ingresos</p>
                            </a>
                        </li>
                        <li class="justify-between bg-gray-700 hover:bg-gray-700 px-4 py-2 rounded-lg">
                            <a href="salidas.html"
                                class="flex flex-col items-start justify-center sm:items-center sm:justify-center lg:flex-row lg:items-center lg:justify-start">
                                <i class="fa-solid fa-right-from-bracket px-4 py-2"></i>
                                <p>Salidas</p>
                            </a>
                        </li>


                    </ul>

                    <!-- Empujar la segunda lista al final -->
                    <div class="flex-grow max-h"></div>

                    <ul class="space-y-3 pb-4">
                        <li class="justify-between hover:bg-red-700 hover:font-semibold px-4 rounded-lg">
                            <a href="./login/login.html"
                                class="flex flex-col items-start justify-center sm:items-center sm:justify-center lg:flex-row lg:items-center lg:justify-start py-2">
                                <i class="fa-solid fa-power-off px-4 py-2"></i>
                                <p class="text-center">Cerrar Sesión</p>
                            </a>
                        </li>
                    </ul>
                </aside>
            </section>

            <!-- Contenido principal -->
            <section class="contenido block ml-2 bg-white rounded-xl w-screen">
                <div class="pt-2 px-4">
                    <h2 class="font-bold text-2xl text-gray-800 self-center">Salidas</h2>
                </div>

                <section class="flex mx-auto w-max-2xl justify-center">
                    <div id="formulario_ingresos_alert">

                        <form id="formulario_salidas" class="">
                            <div class="flex-row space-y-6">
                                <div class="flex space-x-2">
                                    <div class="flex-col">
                                        <label for="vale" class="block mb-2 text-sm font-medium text-gray-900">#
                                            Vale</label>
                                        <input type="number" id="vale" name="vale"
                                            aria-describedby="numero del vale físico" min="0" max="99999"
                                            class="w-24 no-spinner appearance-none bg-gray-50 border border-gray-500 text-gray-900 text-sm rounded-lg p-2.5 dark:text-gray-500 "
                                            placeholder="vale" required />
                                    </div>

                                    <div class="flex-col">
                                        <label for="select_destino"
                                            class="block mb-2 text-sm font-medium text-gray-900">
                                            Destino
                                        </label>
                                        <select id="select_destino" name="select_destino"
                                            aria-describedby="destino de los productos que salen"
                                            class="border text-sm rounded-lg block p-2.5 bg-gray-50 text-gray-900 border-gray-500 focus:ring-gray-950 focus:border-gray-950">
                                        </select>
                                    </div>

                                    <div class="flex-col">
                                        <label for="lote" class="block mb-2 text-sm font-medium text-gray-900">#
                                            Lote
                                        </label>
                                        <input type="number" id="lote" name="lote"
                                            aria-describedby="el lote del que se realizara el retiro de producto"
                                            min="0" max="99999"
                                            class="w-24 no-spinner appearance-none bg-gray-50 border border-gray-500 text-gray-900 text-sm rounded-lg p-2.5 dark:text-gray-500 "
                                            placeholder="lote" required />
                                    </div>

                                    <div class="flex-col">
                                        <label for="marca_asociada"
                                            class="block mb-2 text-sm font-medium text-gray-900">
                                            Marca</label>
                                        <input type="text" id="marca_asociada" name="marca_asociada" disabled
                                            aria-describedby="Marca asociada al lote" readonly
                                            class="w-24 bg-gray-50 border border-gray-500 text-gray-900 text-sm rounded-lg block p-2.5 dark:text-gray-500" />

                                    </div>

                                    <div class="flex-col">
                                        <label for="select_clase" class="block mb-2 text-sm font-medium text-gray-900">
                                            Clase
                                        </label>
                                        <select id="select_clase" name="select_clase"
                                            aria-describedby="clase del producto"
                                            class="border text-sm rounded-lg block p-2.5 bg-gray-50 text-gray-900 border-gray-500 focus:ring-gray-950 focus:border-gray-950">

                                        </select>
                                    </div>

                                    <div class="flex-col">
                                        <label for="cantidad"
                                            class="block mb-2 text-sm font-medium text-gray-900">Cantidad</label>
                                        <input type="number" id="cantidad" name="cantidad"
                                            aria-describedby="cantidad de producto a retirar"
                                            class="w-24 no-spinner bg-gray-50 border border-gray-500 text-gray-900 text-sm rounded-lg block  p-2.5 dark:text-gray-500 "
                                            placeholder="cantidad" min="0" required />
                                    </div>

                                    <div class="flex flex-col justify-end items-end">
                                        <button type="submit" min="0" max="9999"
                                            class="w-full text-white bg-emerald-700 hover:bg-emerald-800 font-medium rounded-lg text-md px-5 py-2.5 text-center dark:bg-emerald-600 dark:hover:bg-emerald-700 dark:focus:ring-emerald-800 shadow-md shadow-gray-400">
                                            Finalizar salida
                                        </button>
                                    </div>
                                </div>


                            </div>
                        </form>
                    </div>

                    <div id="table_salidas"></div>
                </section>
            </section>
        </div>
    </div>


    <!-- SCRIPTS -->
    <!-- Iconos de fontawesome -->
    <!-- <script src="https://kit.fontawesome.com/3469b67fa1.js" crossorigin="anonymous"></script> -->

    <!-- Script interfaz -->
    <script src="app/ui.js"></script>
    <!-- Script navbar -->
    <script src="app/navbar.js"></script>
    <!-- Script formularios -->
    <!-- <script src="app/forms.js"></script> -->
    <!-- Script de salida -->
    <script src="app/form_salidas.js"></script>
</body>

</html>
